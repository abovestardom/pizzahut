<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The buffet was only the beginning | pizzahutbuffet.com</title>
<meta name="description" content="The buffet was only the beginning.">
<meta property="og:title" content="pizzahutbuffet.com">
<meta property="og:description" content="The buffet was only the beginning.">
<meta property="og:image" content="https://www.pizzahutbuffet.com/og-image.gif">
<meta property="og:url" content="https://www.pizzahutbuffet.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#000;color:#ffd93b;
  font-family:'VT323','Courier New',monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;overflow:hidden;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
/* CRT scanlines */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 2px,transparent 2px 4px);
}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
#term{
  text-align:center;padding:0 20px;z-index:2;
  font-size:clamp(2.6rem,11vw,6.5rem);line-height:1.05;letter-spacing:.04em;
  text-shadow:0 0 8px rgba(255,217,59,.9),0 0 32px rgba(214,38,28,.55);
  animation:flicker 4s infinite;
}
@keyframes flicker{
  0%,100%{opacity:1}92%{opacity:1}93%{opacity:.6}94%{opacity:1}96%{opacity:.75}97%{opacity:1}
}
.cursor{display:inline-block;width:.55em;height:1em;background:#ffd93b;vertical-align:-.12em;
  box-shadow:0 0 10px rgba(255,217,59,.9);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
body.leaving #term{transition:opacity .35s;opacity:0}
@media (prefers-reduced-motion: reduce){
  #term{animation:none}
  .cursor{animation:none}
}
</style>
</head>
<body>
<div class="vignette"></div>
<div id="term" aria-live="polite"></div>
<script>
"use strict";
const term = document.getElementById('term');
const LINES = ['THE BUFFET', 'WAS ONLY THE', 'BEGINNING'];
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&@!?<>/\\|';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let held = false;

/* type-in effect */
function typeIn(done){
  if(reduced){ term.innerHTML = LINES.join('<br>'); done(); return; }
  const full = LINES.join('\n');
  let i = 0;
  term.innerHTML = '<span class="cursor"></span>';
  (function step(){
    if(held) return;
    i++;
    const shown = full.slice(0, i).replace(/\n/g, '<br>');
    term.innerHTML = shown + '<span class="cursor"></span>';
    if(i < full.length) setTimeout(step, 55 + Math.random()*60);
    else setTimeout(()=>{ term.innerHTML = shown; done(); }, 400);
  })();
}

/* triple-tap detection */
let taps = [];
addEventListener('pointerup', ()=>{
  if(held) return;
  const now = Date.now();
  taps = taps.filter(t => now - t < 900);
  taps.push(now);
  if(taps.length >= 3) holdSignal();
});

/* the secret: hold the signal */
function holdSignal(){
  held = true;
  scrambleResolve();
}
function scrambleResolve(){
  const full = LINES.join('\n');
  const total = full.length;
  let frame = 0;
  const iv = setInterval(()=>{
    frame++;
    let out = '';
    for(let i = 0; i < total; i++){
      const c = full[i];
      out += (c === '\n') ? '\n' : (Math.random() < frame/14 ? c : CHARS[(Math.random()*CHARS.length)|0]);
    }
    term.innerHTML = out.replace(/\n/g, '<br>');
    if(frame >= 15){
      clearInterval(iv);
      term.innerHTML = 'SIGNAL HELD.<br>SOMETHING IS COMING.';
    }
  }, 60);
}

typeIn(()=>{});
</script>
</body>
</html>
